plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id('kotlin-kapt')
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21"
}

android {
    namespace 'com.atiq.neugelb'
    compileSdk 36

    defaultConfig {
        applicationId "com.atiq.neugelb"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        android.buildFeatures.buildConfig = true
        def movieAccessToken = providers.gradleProperty("MOVIE_API_ACCESS_TOKEN").get()
        buildConfigField("String", "MOVIE_API_ACCESS_TOKEN", movieAccessToken)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.runtime
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    def hilt_version = "2.54"
    implementation("com.google.dagger:hilt-android:$hilt_version")
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    def retrofit_version = "3.0.0"
    implementation("com.squareup.retrofit2:retrofit:$retrofit_version")
    implementation("com.squareup.retrofit2:converter-gson:$retrofit_version")
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    def lifecycle_version = "2.9.4"
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version")
    implementation("androidx.hilt:hilt-navigation-compose:1.3.0")

    implementation("io.coil-kt.coil3:coil-compose:3.2.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.2.0")

    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.1"
    implementation("androidx.compose.material:material-icons-extended")
    
    testImplementation("io.mockk:mockk:1.14.7")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
    implementation "org.jetbrains.kotlin:kotlin-test:2.0.21"
    testImplementation "app.cash.turbine:turbine:1.2.1"

    testImplementation ("org.mockito:mockito-android:5.21.0")

}